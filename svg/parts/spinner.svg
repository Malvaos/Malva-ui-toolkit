<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" color="#8C3274">
<!-- Indeterminate spinner: a 270 degree arc, one turn in 900 ms. It takes the colour of its text (currentColor). -->
<g fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round">
<circle cx="24" cy="24" r="17" stroke-opacity=".18"/>
<path d="M24 7 A17 17 0 0 1 41 24">
<animateTransform attributeName="transform" type="rotate" from="0 24 24" to="360 24 24" dur="0.9s" repeatCount="indefinite"/>
</path></g>
</svg>
